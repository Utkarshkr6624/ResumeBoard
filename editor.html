<script>
/* Build guard. A refresh can be served a cached copy of the page itself, which
 * would leave the tab running assets from an older build. A literal here cannot
 * be cached separately from this document, so a mismatch is a reliable signal
 * that a reload is the right move. */
(function(){
  try {
    var ID = 'd639f64b7f';
    var prev = sessionStorage.getItem('rb:build');
    if (prev === ID) return;
    if (prev && !sessionStorage.getItem('rb:build-reloaded')) {
      sessionStorage.setItem('rb:build-reloaded', '1');
      sessionStorage.setItem('rb:build', ID);
      location.reload();
      return;
    }
    sessionStorage.setItem('rb:build', ID);
  } catch (e) {}
})();
</script>
<script src="assets/js/reset-guard.js?v=d639f64b7f"></script>
