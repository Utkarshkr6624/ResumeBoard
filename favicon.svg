<!-- Resumeboard — app mark
     A document on an accent tile. The tile carries its own contrast, so the
     mark reads on light and dark browser chrome without a scheme-dependent
     variant. Colors are literal copies of the accent-600 and gray-0 tokens in
     assets/css/tokens.css; a favicon cannot read a stylesheet.
     The glyph stays inside the 80% maskable safe circle. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Resumeboard">
  <title>Resumeboard</title>
  <rect width="64" height="64" rx="15" fill="#4743e0"/>
  <path fill="#ffffff" d="M24 12h13.5L46 20.5V49a3 3 0 0 1-3 3H24a3 3 0 0 1-3-3V15a3 3 0 0 1 3-3Z"/>
  <path fill="#4743e0" d="M37.5 12 46 20.5h-8.5Z"/>
  <g fill="#4743e0">
    <rect x="26" y="30" width="15" height="3" rx="1.5"/>
    <rect x="26" y="37" width="11" height="3" rx="1.5"/>
  </g>
</svg>
